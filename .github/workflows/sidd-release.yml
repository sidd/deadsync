name: sidd-release

# Keeps this fork shippable: every few hours, find the newest upstream release,
# replay the patches on the `sidd` branch onto it, build, and publish an Arch
# pacman repo as assets of the GitHub release named `repo`.
#
# Nothing here pushes rebased history. The `sidd` branch only moves when a human
# (or Claude) changes the patch stack; CI rebases in a throwaway checkout.

on:
  schedule:
    - cron: "17 */4 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Rebuild even if upstream tag and patches are unchanged"
        type: boolean
        default: false
      after_resolve:
        description: "Set by the resolve job; stops a conflict from looping"
        type: boolean
        default: false
  push:
    branches: [sidd]
    paths-ignore:
      - "**.md"
      - "docs/**"

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: sidd-release
  cancel-in-progress: false

env:
  UPSTREAM_URL: https://github.com/pnn64/deadsync.git
  GH_TOKEN: ${{ github.token }}
  # Pin gh to this fork. Without it gh resolves the base repo from git remotes
  # and, for a fork with an `upstream` remote, targets the parent project.
  GH_REPO: ${{ github.repository }}

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    outputs:
      conflict: ${{ steps.replay.outputs.conflict }}
      tag: ${{ steps.up.outputs.tag }}
    steps:
      - name: Checkout patch stack
        uses: actions/checkout@v4
        with:
          ref: sidd
          fetch-depth: 0

      - name: Resolve newest upstream release
        id: up
        shell: bash
        run: |
          set -euo pipefail
          tag="$(git ls-remote --tags --refs "$UPSTREAM_URL" 'v*' \
            | sed 's|.*refs/tags/||' \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            | sort -V | tail -1)"
          [ -n "$tag" ] || { echo "no upstream release tag found" >&2; exit 1; }
          # Docs-only commits must not trigger a rebuild, so key on the last code change.
          patch_rev="$(git log -1 --format=%H -- . ':!docs' ':!*.md')"
          state="upstream=${tag} sidd=${patch_rev}"
          {
            echo "tag=${tag}"
            echo "ver=${tag#v}"
            echo "state=${state}"
          } >> "$GITHUB_OUTPUT"
          echo "Newest upstream release: ${tag}"

      - name: Check whether a rebuild is needed
        id: need
        shell: bash
        env:
          STATE: ${{ steps.up.outputs.state }}
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          mkdir -p prev-state
          if [ "${FORCE:-false}" != "true" ] \
             && gh release download repo -p state.txt -D prev-state --clobber 2>/dev/null \
             && [ "$(cat prev-state/state.txt)" = "$STATE" ]; then
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "Already published for: $STATE"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "Needs build for: $STATE"
          fi

      - name: Replay patches onto the upstream release
        id: replay
        if: steps.need.outputs.build == 'true'
        shell: bash
        env:
          TAG: ${{ steps.up.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "sidd-release"
          git config user.email "sidd-release@users.noreply.github.com"
          git remote add upstream "$UPSTREAM_URL"
          git fetch --no-tags upstream "refs/tags/${TAG}:refs/tags/upstream-${TAG}"
          git checkout -B work
          if ! git rebase "refs/tags/upstream-${TAG}"; then
            git status --short | head -20
            git rebase --abort || true
            # Not a failure: the `resolve` job below fixes the stack with Claude.
            echo "conflict=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git log --oneline "refs/tags/upstream-${TAG}..HEAD"

      - name: Build release (Debian 12 container, same as upstream)
        if: steps.need.outputs.build == 'true' && steps.replay.outputs.conflict != '1'
        run: bash scripts/build-linux-release-docker.sh x86_64 native

      - name: Package release tarball
        if: steps.need.outputs.build == 'true' && steps.replay.outputs.conflict != '1'
        run: bash scripts/package-linux-release.sh "${{ steps.up.outputs.tag }}" x86_64 native

      - name: Build pacman package and repo database
        if: steps.need.outputs.build == 'true' && steps.replay.outputs.conflict != '1'
        env:
          TAG: ${{ steps.up.outputs.tag }}
          VER: ${{ steps.up.outputs.ver }}
        run: |
          docker run --rm -v "$PWD:/src" -w /src archlinux:base-devel \
            bash /src/scripts/sidd/build-pacman-repo.sh \
              "/src/dist/deadsync-${TAG}-x86_64-linux.tar.gz" \
              "$VER" "${{ github.run_number }}" /src/repo-out

      - name: Publish to the `repo` release
        if: steps.need.outputs.build == 'true' && steps.replay.outputs.conflict != '1'
        shell: bash
        env:
          STATE: ${{ steps.up.outputs.state }}
        run: |
          set -euo pipefail
          # repo-out was created by root inside the Arch container.
          sudo chown -R "$(id -u):$(id -g)" repo-out
          printf '%s\n' "$STATE" > repo-out/state.txt
          if ! gh release view repo >/dev/null 2>&1; then
            gh release create repo --target sidd \
              --title "pacman repo (sidd)" \
              --notes "Binary pacman repo consumed by the dance box. Not meant to be downloaded by hand."
          fi
          new_pkg="$(cd repo-out && ls deadsync-sidd-*.pkg.tar.zst)"
          gh release upload repo repo-out/* --clobber
          # Remove superseded packages only after the new one is up.
          # `|| true`: grep exits 1 when nothing matches (no older package yet),
          # which would otherwise fail the step under pipefail.
          gh release view repo --json assets -q '.assets[].name' \
            | { grep -E '^deadsync-sidd-.*\.pkg\.tar\.zst$' || true; } \
            | { grep -vx "$new_pkg" || true; } \
            | while read -r old; do gh release delete-asset repo "$old" -y; done

      - name: Keepalive (GitHub disables schedules after 60 quiet days)
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "sidd-release"
          git config user.email "sidd-release@users.noreply.github.com"
          last=0
          if git fetch --no-tags origin keepalive 2>/dev/null; then
            last="$(git log -1 --format=%ct FETCH_HEAD)"
          fi
          if [ $(( $(date +%s) - last )) -gt $(( 20 * 86400 )) ]; then
            blob="$(date -u +%FT%TZ | git hash-object -w --stdin)"
            tree="$(printf '100644 blob %s\tkeepalive\n' "$blob" | git mktree)"
            commit="$(git commit-tree "$tree" -m "keepalive $(date -u +%F)")"
            git push --force origin "${commit}:refs/heads/keepalive"
          fi

      - name: Report failure as an issue
        if: failure()
        shell: bash
        env:
          TAG: ${{ steps.up.outputs.tag }}
        run: |
          set -euo pipefail
          title="sidd-release failed"
          body="Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          if ! gh api "repos/${GITHUB_REPOSITORY}/issues?state=open&per_page=100" -q '.[].title' | grep -qxF "$title"; then
            gh api "repos/${GITHUB_REPOSITORY}/issues" -f title="$title" -f body="$body" >/dev/null
          fi

  # The patch stack conflicts with a new upstream release (this will keep
  # happening). Let Claude rebase it, prove it compiles and passes tests, push
  # the rebased branch, and re-run the build. Needs one repo secret:
  # CLAUDE_CODE_OAUTH_TOKEN (from `claude setup-token`) or ANTHROPIC_API_KEY.
  resolve:
    needs: release
    if: needs.release.outputs.conflict == '1' && inputs.after_resolve != true
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      TAG: ${{ needs.release.outputs.tag }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - name: Checkout patch stack
        uses: actions/checkout@v4
        with:
          ref: sidd
          fetch-depth: 0

      - name: Require credentials
        shell: bash
        run: |
          if [ -z "${CLAUDE_CODE_OAUTH_TOKEN}${ANTHROPIC_API_KEY}" ]; then
            echo "Set repo secret CLAUDE_CODE_OAUTH_TOKEN (claude setup-token) or ANTHROPIC_API_KEY." >&2
            exit 1
          fi

      - name: Install build dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential pkg-config cmake ninja-build libclang-dev libdbus-1-dev \
            libasound2-dev libpipewire-0.3-dev libx11-dev libx11-xcb-dev libxi-dev \
            libxcursor-dev libxrandr-dev libxinerama-dev libwayland-dev libxkbcommon-dev \
            libvulkan-dev libudev-dev libgl1-mesa-dev libxcb1-dev libxcb-randr0-dev
          rustup update stable && rustup default stable
          npm install -g @anthropic-ai/claude-code

      - name: Let Claude rebase onto the new release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "sidd-release"
          git config user.email "sidd-release@users.noreply.github.com"
          git remote add upstream "$UPSTREAM_URL"
          git fetch --no-tags upstream "refs/tags/${TAG}:refs/tags/upstream-${TAG}"
          echo "ORIG=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          git checkout -B work
          prompt="$(sed "s/\$TAG/${TAG}/g" scripts/sidd/resolve-prompt.md)"
          claude -p "$prompt" \
            --permission-mode acceptEdits \
            --max-turns 120 \
            --allowedTools "Read" "Edit" "Write" "Grep" "Glob" "Bash(git:*)" "Bash(cargo:*)" "Bash(ls:*)" "Bash(sed:*)" "Bash(grep:*)" \
            --disallowedTools "Bash(git push:*)" "Bash(git remote:*)"

      - name: Verify the result independently
        shell: bash
        run: |
          set -euo pipefail
          [ ! -e .git/rebase-merge ] && [ ! -e .git/rebase-apply ] || { echo "rebase unfinished" >&2; exit 1; }
          git merge-base --is-ancestor "refs/tags/upstream-${TAG}" HEAD
          [ -z "$(git status --porcelain --untracked-files=no)" ] || { echo "dirty tree" >&2; exit 1; }
          # The agent must not rewrite the machinery that runs it.
          git diff --quiet "$ORIG" HEAD -- .github/workflows/sidd-release.yml packaging scripts/sidd \
            || { echo "agent modified protected files" >&2; exit 1; }
          # Upstream workflow files can't be pushed with GITHUB_TOKEN; keep ours.
          if ! git diff --quiet "$ORIG" HEAD -- .github/workflows; then
            git checkout "$ORIG" -- .github/workflows
            git add -A .github/workflows
            git commit -m "ci: keep fork workflow files (GITHUB_TOKEN cannot update workflows)"
          fi
          cargo check -p deadsync-shell --locked
          cargo test -p deadsync-score -p deadsync-audio-stream -p deadsync-config --lib --locked
          git log --oneline "refs/tags/upstream-${TAG}..HEAD"

      - name: Push rebased stack and re-run the build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          git push --force-with-lease="sidd:${ORIG}" origin HEAD:refs/heads/sidd
          # Pushes made with GITHUB_TOKEN do not trigger workflows; dispatch explicitly.
          gh workflow run sidd-release.yml --ref sidd -f after_resolve=true

      - name: Report failure as an issue
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          title="Patches no longer apply on upstream ${TAG} (auto-resolve failed)"
          body="Claude could not produce a verified rebase. The box keeps its current package. Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          if ! gh api "repos/${GITHUB_REPOSITORY}/issues?state=open&per_page=100" -q '.[].title' | grep -qxF "$title"; then
            gh api "repos/${GITHUB_REPOSITORY}/issues" -f title="$title" -f body="$body" >/dev/null
          fi
